services:
  - type: web
    name: vigia
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 8 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vigia-db
      - key: SECRET_KEY
        generate: true
      - key: GROQ_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false